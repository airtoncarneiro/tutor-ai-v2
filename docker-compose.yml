name: dataforge-ai-lab

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${SQL_MENTOR_POSTGRES_DB:-${TUTOR_POSTGRES_DB:-sql_mentor}}
      POSTGRES_USER: ${SQL_MENTOR_POSTGRES_USER:-${TUTOR_POSTGRES_OWNER_USER:-mentor_admin}}
      POSTGRES_PASSWORD: ${SQL_MENTOR_POSTGRES_PASSWORD:-${TUTOR_POSTGRES_OWNER_PASSWORD:?Defina SQL_MENTOR_POSTGRES_PASSWORD no arquivo .env}}

      TUTOR_APP_PASSWORD: ${SQL_MENTOR_APP_PASSWORD:-${TUTOR_APP_PASSWORD:?Defina SQL_MENTOR_APP_PASSWORD no arquivo .env}}
      TUTOR_RUNNER_PASSWORD: ${SQL_MENTOR_SANDBOX_PASSWORD:-${TUTOR_RUNNER_PASSWORD:?Defina SQL_MENTOR_SANDBOX_PASSWORD no arquivo .env}}
      TUTOR_EVALUATOR_PASSWORD: ${SQL_MENTOR_EVALUATOR_PASSWORD:-${TUTOR_EVALUATOR_PASSWORD:?Defina SQL_MENTOR_EVALUATOR_PASSWORD no arquivo .env}}

    ports:
      - "127.0.0.1:${SQL_MENTOR_POSTGRES_PORT:-${TUTOR_POSTGRES_PORT:-5432}}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s

    stop_grace_period: 10s

volumes:
  postgres_data:
